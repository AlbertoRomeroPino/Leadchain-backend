services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: laravel_leadchain
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      BACKEND_REPO: ${BACKEND_REPO:-https://github.com/AlbertoRomeroPino/Leadchain-backend.git}
      BACKEND_BRANCH: ${BACKEND_BRANCH:-docker}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-leadchain}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      JWT_ALGO: ${JWT_ALGO:-HS256}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "set -e; if [ -d /var/www/html/.git ]; then
        git -C /var/www/html fetch origin && git -C /var/www/html checkout \"$$BACKEND_BRANCH\" && git -C /var/www/html reset --hard \"origin/$$BACKEND_BRANCH\";
      else
        rm -rf /var/www/html/* && git clone --branch \"$$BACKEND_BRANCH\" --single-branch \"$$BACKEND_REPO\" /var/www/html;
      fi; composer install --no-interaction --prefer-dist; php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: postgis/postgis:15-3.3
    container_name: postgres_leadchain
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_DATABASE:-leadchain}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-root} -d ${DB_DATABASE:-leadchain}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
